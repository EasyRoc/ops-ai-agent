deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        index:
          prefix: loki_index_
          period: 24h
        object_store: filesystem
  storage:
    type: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: false

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
