<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ops AI Agent 控制台</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fb;
      --card: #ffffff;
      --text: #202733;
      --muted: #667085;
      --line: #e5e7eb;
      --primary: #2563eb;
      --warn: #d97706;
      --ok: #059669;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      padding: 28px 36px 18px;
      background: #111827;
      color: white;
    }
    header p { margin: 8px 0 0; color: #cbd5e1; }
    main { padding: 28px 36px; }
    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 18px;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      background: var(--primary);
      color: white;
      cursor: pointer;
      font-weight: 600;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.05);
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }
    th { color: var(--muted); background: #f9fafb; font-weight: 700; }
    tr:hover td { background: #f8fafc; }
    a { color: var(--primary); text-decoration: none; font-weight: 600; }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      background: #e0e7ff;
      color: #3730a3;
      font-size: 12px;
      font-weight: 700;
    }
    .pending_approval { background: #fef3c7; color: #92400e; }
    .approved { background: #d1fae5; color: #065f46; }
    .rejected { background: #fee2e2; color: #991b1b; }
    .empty, .error {
      padding: 28px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <h1>Ops AI Agent 控制台</h1>
    <p>查看告警事件、Runbook 处置方案、风险评估和人工审批状态。</p>
  </header>
  <main>
    <div class="toolbar">
      <button onclick="loadIncidents()">刷新事件</button>
      <span id="summary">正在加载...</span>
    </div>
    <section class="card">
      <table>
        <thead>
          <tr>
            <th>事件</th>
            <th>服务</th>
            <th>级别</th>
            <th>状态</th>
            <th>Runbook</th>
            <th>风险</th>
            <th>创建时间</th>
          </tr>
        </thead>
        <tbody id="incidentRows"></tbody>
      </table>
      <div id="empty" class="empty" hidden>暂时没有事件。触发一次告警后，这里会出现诊断结果。</div>
      <div id="error" class="error" hidden></div>
    </section>
  </main>
  <script>
    function badge(text, cls) {
      return `<span class="badge ${cls || ""}">${text || "-"}</span>`;
    }

    async function loadIncidents() {
      const rows = document.getElementById("incidentRows");
      const summary = document.getElementById("summary");
      const empty = document.getElementById("empty");
      const error = document.getElementById("error");
      rows.innerHTML = "";
      error.hidden = true;
      summary.textContent = "正在加载...";

      try {
        const response = await fetch("/api/v1/incidents?limit=50");
        if (!response.ok) throw new Error(`接口返回 ${response.status}`);
        const data = await response.json();
        summary.textContent = `共 ${data.total || 0} 个事件`;
        empty.hidden = (data.incidents || []).length > 0;
        rows.innerHTML = (data.incidents || []).map((item) => {
          const risk = item.risk_assessment ? `${item.risk_assessment.level || "-"} / ${item.risk_assessment.score || 0}分` : "-";
          const created = item.created_at ? new Date(item.created_at).toLocaleString() : "-";
          return `
            <tr>
              <td><a href="/incident-detail.html?id=${encodeURIComponent(item.id)}">${item.id}</a><br>${item.alert_name || ""}</td>
              <td>${item.service || "-"}</td>
              <td>${item.severity || "-"}</td>
              <td>${badge(item.approval_status || item.status, item.approval_status || item.status)}</td>
              <td>${item.runbook_name || "未匹配"}</td>
              <td>${risk}</td>
              <td>${created}</td>
            </tr>
          `;
        }).join("");
      } catch (err) {
        summary.textContent = "加载失败";
        error.hidden = false;
        error.textContent = `无法读取 /api/v1/incidents：${err.message}`;
      }
    }

    loadIncidents();
  </script>
</body>
</html>
