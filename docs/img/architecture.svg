<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ops AI Agent 系统架构</title>
  <desc id="desc">展示 Demo 服务、可观测栈、Agent、数据库、Runbook 和飞书之间的关系。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EFF6FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2L10 6L2 10" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0F172A; }
      .subtitle { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748B; }
      .box { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; filter: url(#shadow); }
      .box-blue { fill: #EFF6FF; stroke: #93C5FD; }
      .box-green { fill: #ECFDF5; stroke: #86EFAC; }
      .box-orange { fill: #FFF7ED; stroke: #FDBA74; }
      .box-purple { fill: #F5F3FF; stroke: #C4B5FD; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1E293B; }
      .small { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748B; }
      .pill { fill: #DBEAFE; }
      .pill-text { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1D4ED8; }
      .arrow { stroke: #2563EB; stroke-width: 2.2; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <text x="48" y="58" class="title">Ops AI Agent 系统架构</text>
  <text x="48" y="86" class="subtitle">从监控告警到根因诊断、Runbook 方案、风险评估和人工审批的本地演示环境</text>

  <rect x="56" y="138" width="190" height="250" rx="18" class="box box-green"/>
  <text x="84" y="176" class="label">Demo 服务</text>
  <text x="84" y="210" class="small">frontend-service</text>
  <text x="84" y="236" class="small">order-service</text>
  <text x="84" y="262" class="small">payment-service</text>
  <text x="84" y="288" class="small">inventory-service</text>
  <rect x="84" y="318" width="126" height="30" rx="15" class="pill"/>
  <text x="101" y="338" class="pill-text">Micrometer</text>

  <rect x="316" y="120" width="220" height="286" rx="18" class="box box-blue"/>
  <text x="348" y="158" class="label">可观测栈</text>
  <text x="348" y="196" class="small">Prometheus：指标与告警规则</text>
  <text x="348" y="224" class="small">Alertmanager：告警路由</text>
  <text x="348" y="252" class="small">Grafana：业务与 K8S 看板</text>
  <text x="348" y="280" class="small">Loki / Promtail：日志查询</text>

  <rect x="602" y="100" width="260" height="326" rx="20" class="box box-purple"/>
  <text x="638" y="140" class="label">FastAPI Agent</text>
  <text x="638" y="180" class="small">Webhook：/api/v1/alerts</text>
  <text x="638" y="208" class="small">LangGraph：诊断工作流</text>
  <text x="638" y="236" class="small">RCA：DeepSeek + 规则兜底</text>
  <text x="638" y="264" class="small">Runbook：方案匹配</text>
  <text x="638" y="292" class="small">Risk：风险评估</text>
  <text x="638" y="320" class="small">Approval：飞书审批回调</text>
  <rect x="638" y="348" width="154" height="30" rx="15" class="pill"/>
  <text x="658" y="368" class="pill-text">Web Console</text>

  <rect x="932" y="116" width="210" height="120" rx="18" class="box"/>
  <text x="964" y="154" class="label">PostgreSQL</text>
  <text x="964" y="188" class="small">Incident</text>
  <text x="964" y="214" class="small">诊断、方案、审批状态</text>

  <rect x="932" y="276" width="210" height="120" rx="18" class="box box-orange"/>
  <text x="964" y="314" class="label">飞书群</text>
  <text x="964" y="348" class="small">告警卡片</text>
  <text x="964" y="374" class="small">诊断卡片 + 审批按钮</text>

  <rect x="604" y="462" width="256" height="58" rx="18" class="box"/>
  <text x="638" y="496" class="label">Runbooks</text>
  <text x="742" y="496" class="small">CPU / OOM / Error / Latency</text>

  <path d="M246 218C270 218 288 218 316 218" class="arrow"/>
  <path d="M536 224C560 224 574 224 602 224" class="arrow"/>
  <path d="M862 182C888 182 904 182 932 182" class="arrow"/>
  <path d="M862 336C890 336 904 336 932 336" class="arrow"/>
  <path d="M732 426V462" class="arrow"/>
  <path d="M604 330C560 330 556 320 536 292" class="arrow dash"/>
  <path d="M602 270C566 270 556 270 536 270" class="arrow dash"/>

  <text x="256" y="205" class="small">指标 / 日志</text>
  <text x="544" y="210" class="small">告警</text>
  <text x="878" y="168" class="small">落库</text>
  <text x="878" y="322" class="small">通知 / 回调</text>
</svg>
