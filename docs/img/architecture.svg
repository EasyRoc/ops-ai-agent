<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ops AI Agent AI 兜底系统架构</title>
  <desc id="desc">展示 Demo 服务、可观测栈、FastAPI Agent、Runbook、AI 兜底、重试工作流、数据库、飞书和 Web Console 的关系。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <filter id="shadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2L10 6L2 10" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2L10 6L2 10" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2L10 6L2 10" stroke="#EA580C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0F172A; }
      .subtitle { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748B; }
      .box { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; filter: url(#shadow); }
      .blue { fill: #EFF6FF; stroke: #93C5FD; }
      .green { fill: #ECFDF5; stroke: #86EFAC; }
      .orange { fill: #FFF7ED; stroke: #FDBA74; }
      .purple { fill: #F5F3FF; stroke: #C4B5FD; }
      .red { fill: #FEF2F2; stroke: #FCA5A5; }
      .slate { fill: #F8FAFC; stroke: #CBD5E1; }
      .label { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1E293B; }
      .small { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748B; }
      .tiny { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748B; }
      .pill { fill: #DBEAFE; }
      .pill-green { fill: #D1FAE5; }
      .pill-orange { fill: #FFEDD5; }
      .pill-purple { fill: #EDE9FE; }
      .pill-red { fill: #FEE2E2; }
      .pill-text { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1D4ED8; }
      .pill-text-green { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #047857; }
      .pill-text-orange { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #C2410C; }
      .pill-text-purple { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6D28D9; }
      .pill-text-red { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #B91C1C; }
      .arrow-blue { stroke: #2563EB; stroke-width: 2.2; marker-end: url(#arrowBlue); fill: none; }
      .arrow-green { stroke: #059669; stroke-width: 2.2; marker-end: url(#arrowGreen); fill: none; }
      .arrow-orange { stroke: #EA580C; stroke-width: 2.2; marker-end: url(#arrowOrange); fill: none; }
      .dash { stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="48" y="58" class="title">Ops AI Agent AI 兜底系统架构</text>
  <text x="48" y="86" class="subtitle">告警进入后优先 Runbook；未命中则 AI 生成方案，飞书确认后执行，失败可自省重试，过程全量审计可观测</text>

  <rect x="48" y="138" width="190" height="246" rx="18" class="box green"/>
  <text x="78" y="176" class="label">Demo 服务</text>
  <text x="78" y="210" class="small">frontend / order</text>
  <text x="78" y="236" class="small">payment / inventory</text>
  <text x="78" y="268" class="small">Actuator Prometheus</text>
  <rect x="78" y="306" width="126" height="30" rx="15" class="pill-green"/>
  <text x="96" y="326" class="pill-text-green">故障注入</text>
  <text x="78" y="358" class="tiny">CPU / 错误率 / 延迟 / 内存</text>

  <rect x="286" y="118" width="222" height="290" rx="18" class="box blue"/>
  <text x="318" y="156" class="label">可观测栈</text>
  <text x="318" y="192" class="small">Prometheus：指标与告警规则</text>
  <text x="318" y="220" class="small">Alertmanager：Webhook 路由</text>
  <text x="318" y="248" class="small">Loki / Promtail：错误日志</text>
  <text x="318" y="276" class="small">Grafana：业务与 K8S 看板</text>
  <rect x="318" y="318" width="148" height="30" rx="15" class="pill"/>
  <text x="340" y="338" class="pill-text">验证数据源</text>
  <text x="318" y="374" class="tiny">执行后轮询恢复指标</text>

  <rect x="560" y="104" width="318" height="514" rx="22" class="box purple"/>
  <text x="596" y="144" class="label">FastAPI Agent</text>
  <text x="596" y="176" class="small">Webhook：/api/v1/alerts</text>
  <text x="596" y="204" class="small">LangGraph：告警 / 执行 / 重试</text>
  <text x="596" y="232" class="small">RCA：DeepSeek + 规则兜底</text>

  <rect x="596" y="264" width="112" height="32" rx="16" class="pill-purple"/>
  <text x="620" y="285" class="pill-text-purple">Runbook</text>
  <rect x="722" y="264" width="120" height="32" rx="16" class="pill-orange"/>
  <text x="742" y="285" class="pill-text-orange">AI Fallback</text>

  <text x="596" y="326" class="small">Risk：白名单 + 风险评分</text>
  <text x="596" y="354" class="small">Approval：飞书按钮回调</text>

  <rect x="596" y="386" width="102" height="32" rx="16" class="pill-purple"/>
  <text x="618" y="407" class="pill-text-purple">Executor</text>
  <rect x="712" y="386" width="86" height="32" rx="16" class="pill-purple"/>
  <text x="734" y="407" class="pill-text-purple">Verify</text>
  <rect x="596" y="432" width="126" height="32" rx="16" class="pill-orange"/>
  <text x="616" y="453" class="pill-text-orange">Retry Analyze</text>
  <rect x="736" y="432" width="82" height="32" rx="16" class="pill-purple"/>
  <text x="758" y="453" class="pill-text-purple">Report</text>

  <rect x="596" y="492" width="106" height="32" rx="16" class="pill-red"/>
  <text x="619" y="513" class="pill-text-red">Escalate</text>
  <rect x="716" y="492" width="86" height="32" rx="16" class="pill-purple"/>
  <text x="738" y="513" class="pill-text-purple">Audit</text>
  <text x="596" y="562" class="tiny">AI 方案必须通过结构化校验和命令白名单</text>
  <text x="596" y="586" class="tiny">失败后最多 5 轮确认式重试，超限转人工</text>

  <rect x="930" y="96" width="218" height="178" rx="18" class="box slate"/>
  <text x="962" y="134" class="label">PostgreSQL / Redis</text>
  <text x="962" y="168" class="small">incidents：AI 推理 / 重试历史</text>
  <text x="962" y="194" class="small">executions：执行轮次</text>
  <text x="962" y="220" class="small">reports：Markdown 报告</text>
  <text x="962" y="246" class="small">audit_logs + fingerprint 去重</text>

  <rect x="930" y="314" width="218" height="142" rx="18" class="box orange"/>
  <text x="962" y="352" class="label">飞书群</text>
  <text x="962" y="386" class="small">Runbook 审批卡片</text>
  <text x="962" y="412" class="small">AI 兜底 / 重试卡片</text>
  <text x="962" y="438" class="small">批准 / AI自动 / 继续 / 转人工</text>

  <rect x="930" y="496" width="218" height="112" rx="18" class="box green"/>
  <text x="962" y="534" class="label">Web Console</text>
  <text x="962" y="562" class="small">Incident / 执行记录 / 报告</text>
  <text x="962" y="588" class="small">AI 推理 / 重试时间线 / 审计日志</text>

  <rect x="286" y="472" width="222" height="116" rx="18" class="box slate"/>
  <text x="318" y="510" class="label">Runbooks</text>
  <text x="318" y="544" class="small">CPU / OOM / Error / Latency</text>
  <text x="318" y="570" class="tiny">未命中时进入 AI Fallback</text>

  <path d="M238 226H286" class="arrow-blue"/>
  <path d="M508 226H560" class="arrow-blue"/>
  <path d="M878 178H930" class="arrow-blue"/>
  <path d="M878 382H930" class="arrow-orange"/>
  <path d="M878 552H930" class="arrow-green"/>
  <path d="M668 264C620 248 564 250 508 502" class="arrow-blue dash"/>
  <path d="M782 296C902 282 922 320 930 358" class="arrow-orange dash"/>
  <path d="M638 418C520 548 356 476 238 356" class="arrow-green"/>
  <path d="M754 418C640 458 556 388 466 348" class="arrow-blue dash"/>
  <path d="M656 464C610 514 646 548 714 524" class="arrow-orange dash"/>

  <text x="248" y="212" class="small">指标 / 日志</text>
  <text x="518" y="212" class="small">Webhook</text>
  <text x="890" y="164" class="small">状态 / 审计</text>
  <text x="890" y="368" class="small">通知 / 回调</text>
  <text x="892" y="538" class="small">展示</text>
  <text x="394" y="456" class="small">Runbook 命中</text>
  <text x="826" y="304" class="small">AI 未知告警</text>
  <text x="316" y="448" class="small">kubectl 变更</text>
  <text x="458" y="344" class="small">恢复验证</text>
</svg>
